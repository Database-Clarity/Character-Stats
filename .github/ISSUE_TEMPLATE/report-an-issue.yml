name: Report an Issue
description: Create a report to let me know I got something wrong.
title: "[Something] is wrong with [something]"
labels: Invalid
assignees:
  - StardustD2
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this form! Cooldowns are derived from a base cooldown and stat-dependent scalar data. Small (~1s) differences may be artifacts of the calculation method, but please report clear inaccuracies in base cooldowns or scalar values with supporting evidence.
  - type: dropdown
    attributes:
      label: Type of Issue
      description: Select the appropriate type of issue you've noticed. 
      options:
        - Incorrect Cooldown
        - Missing Entry
        - Hash/Name Mismatch
        - Other
    validations:
      required: true
  - type: input
    attributes:
      label: Issue Details
      description: Briefly describe the specific issue you've found with the information provided.
      placeholder: ex. The cooldown of [X] is 19 seconds shorter.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Sources and Proof
      description: Go into more detail on the issue if needed and back up your claim(s) with a trustworthy source. Screenshots of the in-game UI or personal testing will suffice if reproducable. Provide any additional context you deem necessary.
    validations:
      required: true
