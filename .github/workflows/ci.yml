name: CI

on:
  push:
    branches: [master, v2.0-overhaul]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Check formatting
        run: npm run format:check
      - name: Check data files use the editor save format
        run: npm run format:data -- --check
      - name: Run tests
        run: npm test
      - name: Validate sources and export
        run: npm run validate
      - name: Build editor
        run: npm run build
