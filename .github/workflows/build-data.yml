name: Build data

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Optional release notes for this data build.
        required: false
        type: string

concurrency:
  group: data-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      schema_version: ${{ steps.version.outputs.schema_version }}
    steps:
      - name: Check out dispatched ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Fast-forward to latest dispatched branch
        env:
          PUSH_REF: ${{ github.ref }}
        run: git pull --ff-only origin "$PUSH_REF"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build data
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          npm run build:data -- --release-notes "$RELEASE_NOTES"
      - name: Record resulting version
        id: version
        run: |
          VERSION=$(node -p "require('./update.json').schemaVersion")
          echo "schema_version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Commit and push generated data
        env:
          VERSION: ${{ steps.version.outputs.schema_version }}
          PUSH_REF: ${{ github.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- versions/ update.json CHANGELOGS.md
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
            exit 0
          fi
          git commit -m "Data build v${VERSION}" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin "HEAD:${PUSH_REF}"

  deploy-pages:
    if: github.ref == 'refs/heads/master'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
