name: Build data

on:
  workflow_dispatch:
    inputs:
      schema_version:
        description: Leave empty to rebuild the current version; set new X.Y for a breaking release.
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      schema_version: ${{ steps.version.outputs.schema_version }}
    steps:
      - name: Check out dispatched ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Validate schema version input
        env:
          SCHEMA_VERSION: ${{ inputs.schema_version }}
        run: |
          if [[ -n "$SCHEMA_VERSION" && ! "$SCHEMA_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "schema_version must match X.Y (for example 2.1)." >&2
            exit 1
          fi
      - name: Build data
        env:
          SCHEMA_VERSION: ${{ inputs.schema_version }}
        run: |
          if [[ -n "$SCHEMA_VERSION" ]]; then
            npm run build:data -- --schema-version "$SCHEMA_VERSION"
          else
            npm run build:data
          fi
      - name: Record resulting version
        id: version
        run: |
          VERSION=$(node -p "require('./update.json').schemaVersion")
          echo "schema_version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Commit and push generated data
        env:
          VERSION: ${{ steps.version.outputs.schema_version }}
          PUSH_REF: ${{ github.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- versions/ update.json
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
            exit 0
          fi
          git commit -m "Data build v${VERSION}"
          # Integrate commits (e.g. editor saves) that landed while building.
          git pull --rebase origin "${PUSH_REF}"
          git push origin "HEAD:${PUSH_REF}"

  deploy-pages:
    if: github.ref == 'refs/heads/master'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
